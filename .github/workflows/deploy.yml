name: Deploy Liza Bot

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.213.177.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BOT_TOKEN,ALLOWED_USER_ID,GROQ_API_KEYS
          script: |
            set -e
            cd /home/ubuntu
            rm -rf liza
            git clone --depth 1 https://github.com/JoTalbot/liza.git liza
            cd liza
            cat > .env <<EOM
            BOT_TOKEN=$BOT_TOKEN
            ALLOWED_USER_ID=$ALLOWED_USER_ID
            GROQ_API_KEYS=$GROQ_API_KEYS
            EOM
            sudo mkdir -p /opt/liza_data
            sudo docker stop liza-bot 2>/dev/null || true
            sudo docker rm liza-bot 2>/dev/null || true
            sudo docker build -t liza-bot .
            sudo docker run -d --name liza-bot --restart unless-stopped -v /opt/liza_data:/data --env-file .env liza-bot
            sudo docker ps --filter name=liza-bot
