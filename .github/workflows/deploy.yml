name: Deploy Liza Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Секреты подставляет сам GitHub Actions (${{ secrets.X }}),
      # значения в логах маскируются автоматически
      - name: Create .env from secrets
        run: |
          echo 'BOT_TOKEN=${{ secrets.BOT_TOKEN }}' > .env
          echo 'ALLOWED_USER_ID=${{ secrets.ALLOWED_USER_ID }}' >> .env
          echo 'GROQ_API_KEYS=${{ secrets.GROQ_API_KEYS }}' >> .env
          if [ -n "${{ secrets.GROQ_CHAT_MODEL }}" ]; then echo 'GROQ_CHAT_MODEL=${{ secrets.GROQ_CHAT_MODEL }}' >> .env; fi
          if [ -n "${{ secrets.GOOGLE_DOC_WEBHOOK_URL }}" ]; then echo 'GOOGLE_DOC_WEBHOOK_URL=${{ secrets.GOOGLE_DOC_WEBHOOK_URL }}' >> .env; fi
          if [ -n "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then echo 'GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' >> .env; fi
          if [ -n "${{ secrets.GOOGLE_DOC_ID }}" ]; then echo 'GOOGLE_DOC_ID=${{ secrets.GOOGLE_DOC_ID }}' >> .env; fi
          wc -l .env

      - name: Prepare server (clone code)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.213.177.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu
            rm -rf liza
            git clone --depth 1 https://github.com/JoTalbot/liza.git liza
            sudo mkdir -p /opt/liza_data /opt/liza_chrome_profile

      - name: Upload .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 129.213.177.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: "/home/ubuntu/liza"

      - name: Compose up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.213.177.56
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/liza
            grep -q '^BOT_TOKEN=.\+' .env || { echo '!! BOT_TOKEN пуст'; exit 1; }
            grep -q '^ALLOWED_USER_ID=.\+' .env || { echo '!! ALLOWED_USER_ID пуст'; exit 1; }
            grep -q '^GROQ_API_KEYS=.\+' .env || { echo '!! GROQ_API_KEYS пуст'; exit 1; }
            sudo docker compose version
            # -t 30: даём Chromium время записать куки/сессию (graceful shutdown)
            sudo docker stop -t 30 liza-bot liza-browser 2>/dev/null || true
            sudo docker rm liza-bot liza-browser 2>/dev/null || true
            sudo docker compose up -d --build
            sleep 15
            echo '== docker compose ps =='
            sudo docker compose ps
            echo '== bot logs =='
            sudo docker logs liza-bot 2>&1 | tail -10
            echo '== CDP check =='
            curl -s -m 8 http://localhost:9222/json/version | head -c 200 || echo 'CDP ещё не готов'
            echo ''
            echo '== noVNC check =='
            curl -s -m 8 -o /dev/null -w 'noVNC HTTP %{http_code}\n' http://localhost:6080/vnc.html || echo 'noVNC ещё не готов'
